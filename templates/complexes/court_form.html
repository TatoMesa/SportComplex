{% extends "layouts/app.html" %}

{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="max-w-lg">
  <form method="post" class="space-y-6">
    {% csrf_token %}

    <div class="bg-white rounded-xl border border-gray-100 p-6 space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
        {{ form.name }}
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Deporte *</label>
          {{ form.sport }}
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Superficie</label>
          {{ form.surface }}
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Precio por hora *</label>
        {{ form.price_per_hour }}
      </div>

      <div class="flex items-center gap-6">
        <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
          {{ form.is_indoor }}
          <span>Cancha cubierta</span>
        </label>
        <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
          {{ form.is_active }}
          <span>Activa</span>
        </label>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notas</label>
        {{ form.notes }}
      </div>

    </div>

    <div class="flex items-center gap-3">
      <button type="submit"
              class="rounded-lg bg-primary-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-primary-700 transition">
        {{ submit_label }}
      </button>
      <a href="{% url 'complexes:detail' complex.slug %}"
         class="rounded-lg border border-gray-200 px-5 py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-50 transition">
        Cancelar
      </a>
    </div>

  </form>
</div>
{% endblock %}
