{% extends "layouts/app.html" %}

{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="max-w-lg">
  <form method="post" class="space-y-6">
    {% csrf_token %}

    <div class="bg-white rounded-xl border border-gray-100 p-6 space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
        {{ form.name }}
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
          {{ form.category }}
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Precio *</label>
          {{ form.price }}
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Stock inicial</label>
          {{ form.stock }}
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Stock mínimo</label>
          {{ form.min_stock }}
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
        {{ form.description }}
      </div>

      <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
        {{ form.is_active }}
        <span>Producto activo</span>
      </label>

    </div>

    <div class="flex items-center gap-3">
      <button type="submit"
              class="rounded-lg bg-primary-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-primary-700 transition">
        {{ submit_label }}
      </button>
      <a href="{% url 'products:complex_list' complex.slug %}"
         class="rounded-lg border border-gray-200 px-5 py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-50 transition">
        Cancelar
      </a>
    </div>

  </form>
</div>
{% endblock %}
