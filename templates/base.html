<!DOCTYPE html>
<html lang="es" class="h-full" x-data="{ darkMode: localStorage.getItem('darkMode') === 'true' }" :class="{ 'dark': darkMode }">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SportComplex{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            },
            accent: {
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
            },
            success: '#10b981',
            warning: '#f59e0b',
            danger: '#ef4444',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          backgroundImage: {
            'gradient-brand': 'linear-gradient(135deg, #0284c7 0%, #7c3aed 100%)',
            'gradient-dark': 'linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%)',
          },
        },
      },
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  {# Alpine.js para el dark mode toggle #}
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    /* Transición suave para dark mode */
    * { transition: background-color 0.2s ease, border-color 0.2s ease; }
    /* Scrollbar custom */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-gray-50 dark:bg-gray-950 font-sans antialiased">

  {% if messages %}
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm">
      {% for message in messages %}
        <div class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm shadow-lg backdrop-blur-sm
          {% if message.tags == 'error' %}bg-red-500/10 text-red-400 border border-red-500/20
          {% elif message.tags == 'success' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20
          {% elif message.tags == 'warning' %}bg-amber-500/10 text-amber-400 border border-amber-500/20
          {% else %}bg-brand-500/10 text-brand-400 border border-brand-500/20{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  {% block body %}{% endblock %}

  {% block extra_js %}{% endblock %}
</body>
</html>
