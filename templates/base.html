<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SportComplex{% endblock %}</title>

  {# Tailwind CDN — reemplazar por build en producción #}
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50:  '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-gray-50 font-sans antialiased">

  {# Mensajes del sistema #}
  {% if messages %}
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
      {% for message in messages %}
        <div class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm shadow-lg
          {% if message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200
          {% elif message.tags == 'success' %}bg-green-50 text-green-800 border border-green-200
          {% elif message.tags == 'warning' %}bg-yellow-50 text-yellow-800 border border-yellow-200
          {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  {% block body %}{% endblock %}

  {% block extra_js %}{% endblock %}
</body>
</html>
