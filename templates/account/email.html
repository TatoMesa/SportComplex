{% extends "layouts/app.html" %}
{% block page_title %}Cambiar email{% endblock %}
{% block content %}
<div class="max-w-md">
  <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 p-6">
    {% for form in forms %}
      <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
          <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
              {{ field.label }}
            </label>
            <input type="{{ field.field.widget.input_type }}"
                   name="{{ field.html_name }}"
                   class="w-full rounded-xl border border-gray-200 dark:border-gray-700
                          bg-white dark:bg-gray-800 text-gray-900 dark:text-white
                          px-4 py-2.5 text-sm focus:outline-none focus:ring-2
                          focus:ring-brand-500 transition">
          </div>
        {% endfor %}
        <button type="submit"
                class="w-full rounded-xl bg-gradient-brand px-4 py-2.5 text-sm font-bold
                       text-white shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40
                       transition-all duration-200">
          Guardar
        </button>
      </form>
    {% endfor %}
  </div>
</div>
{% endblock %}
